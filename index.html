    <style>

            --primary-color: #0d6efd;
            --secondary-color: #2c3e50;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --border-color: #cbd5e1;

        body {

            margin: 0 0 10px 0;

            color: #cbd5e1;
            font-size: 1.2rem;

            max-width: 600px;
            margin: 25px auto 0 auto;
            position: relative;

        .search-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 1.1rem;
            border: 2px solid #cbd5e1;
            border-radius: 30px;
            outline: none;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            transition: border-color 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .search-input:focus {
            border-color: var(--primary-color);
        }

        /* شريط آخر المقالات التلقائي الاحترافي */
        .latest-ticker {
            background-color: #1e293b;
            color: #fff;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            overflow: hidden;
            border-bottom: 1px solid #334155;
            font-size: 0.95rem;
            margin-top: 25px;
        }
        .ticker-title {
            background-color: var(--primary-color);
            color: white;
            padding: 5px 12px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 15px;
            white-space: nowrap;
            z-index: 10;
        }
        .ticker-container {
            overflow: hidden;
            width: 100%;
            white-space: nowrap;
        }
        .ticker-content {
            white-space: nowrap;
            display: inline-block;
            animation: ticker 25s linear infinite;
        }
        .ticker-content span {
            margin-left: 40px;
            color: #94a3b8;
            transition: color 0.2s;
            cursor: pointer;
        }
        .ticker-content span:hover {
            color: #fff;
            text-decoration: underline;
        }
        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* مكان إعلان أدسنس الرئيسي الصوري */
        .top-hero-ad-wrapper {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0 40px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
        }

        .section-title {
            font-size: 1.8rem;
            color: var(--secondary-color);
            margin-bottom: 25px;
            border-right: 5px solid var(--primary-color);
            padding-right: 15px;
        }
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        .article-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.12);
        }
        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .article-card h3 {
            color: var(--secondary-color);
            margin-top: 0;
            font-size: 1.3rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .article-card p {
            color: #334155;
            font-size: 0.95rem;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .read-more {
            display: block;
            background-color: var(--primary-color);
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
        }
        .read-more:hover {
            background-color: #0b5ed7;
        }

        .home-ad-wrapper {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin: 40px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
        }

        /* نافذة العرض المنبثقة (Modal) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);

            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 15px;
            box-sizing: border-box;
            margin-bottom: 25px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);

        .video-watermark {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .video-watermark span {
            color: #38bdf8;
        }

        .modal-title {
            color: var(--secondary-color);
            margin-top: 0;
            font-size: 1.8rem;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .modal-body {
            color: #212529;
            font-size: 1.1rem;
            text-align: justify;
        }
        .modal-body h2 {
            color: var(--secondary-color);
            font-size: 1.4rem;
            margin-top: 30px;
            border-right: 4px solid var(--primary-color);
            padding-right: 12px;
        }
        .modal-body h3 {
            color: #1e293b;
            font-size: 1.2rem;
            margin-top: 20px;
        }
        .modal-body ul, .modal-body ol {
            padding-right: 20px;
        }
        .modal-body li {
            margin-bottom: 10px;
        }

        /* الأزرار الـ 3 الذكية والواضحة أسفل المقال تماماً */
        .modal-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #e2e8f0;
            gap: 10px;
        }
        .nav-btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background 0.2s, transform 0.2s;
            flex: 1;
            text-align: center;
        }
        .nav-btn:hover {
            background-color: var(--primary-color);
            transform: translateY(-2px);
        }
        .nav-btn-home {
            background-color: #0d6efd;
        }

        .article-ad-container {
            margin: 35px 0;
            text-align: center;
            background: #fdfdfd;
            padding: 15px;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            background-color: #2c3e50;
            color: #ffffff;

            font-size: 0.95rem;

            color: #93c5fd;

            cursor: pointer;
            transition: color 0.2s;
        }
        .footer-links a:hover {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>

    <script>

        const adCodeInArticle = `

                <ins class="adsbygoogle"

        // قاعدة بيانات المقالات (تضم جميع المقالات الأربعة معاً ودون أي نقص)
        const articlesData = [
            {
                title: "الدليل الطبي الشامل للاضطرابات والأمراض النفسية: الأعراض، الأسباب، والبروتوكولات العلاجية المتقدمة",
                desc: "دليل موسوعي أكاديمي شامل حول الصحة النفسية، اضطرابات القلق، الاكتئاب الجسيم، ثنائي القطب، الفصام، الوسواس القهري، والبروتوكولات العلاجية الحديثة.",
                image: "https://images.unsplash.com/photo-1516549655169-df83a0774514?auto=format&fit=crop&w=800&q=80",
                videoHTML: `
                    <div style="width: 100%; display: flex; flex-direction: column; align-items: center; background: #0f172a; padding: 15px; border-radius: 8px;">
                        <img src="https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?auto=format&fit=crop&w=800&q=80" alt="معاناة الاكتئاب النفسي والعزلة" style="width: 100%; max-height: 280px; border-radius: 6px; object-fit: cover;">
                        <div style="color: #38bdf8; font-size: 0.95rem; font-weight: bold; margin-top: 10px;">دليل مرئي تخصصي: الاضطرابات والأمراض النفسية وطرق العلاج</div>
                    </div>
                `,
                content: `
                    <p>تُعرّف الصحة النفسية بأنها الحالة التي يدرك فيها الفرد إمكانياته، ويستطيع التعامل مع ضغوط الحياة العادية، والعمل بشكل منتج، والإسهام في مجتمعه. وفي المقابل، تمثل الاضطرابات النفسية مجموعة من الحالات الصحية التي تؤثر على المزاج، التفكير، والسلوك، مما يتطلب تدخلاً علمياً دقيقاً.</p>
                    
                    <h2>أولاً: التصنيف التفصيلي للاضطرابات النفسية وأعراضها</h2>
                    
                    <h3>1. اضطرابات القلق (Anxiety Disorders)</h3>
                    <p>تتجاوز هذه الاضطرابات مشاعر القلق المؤقتة لتصبح حالة مزمنة تعيق الحياة اليومية:</p>
                    <ul>
                        <li><strong>اضطراب القلق العام (GAD):</strong> قلق ومخاوف مفرطة ومستمرة بشأن الأحداث اليومية (العمل، الصحة، المال) لمدة لا تقل عن 6 أشهر، يصاحبها توتر عضلي وإرهاق ذهني.</li>
                        <li><strong>نوبات الهلع (Panic Disorder):</strong> نوبات مفاجئة وشديدة من الخوف الذروي تتراوح أعراضها بين تسارع دقات القلب، التعرق، الارتجاف، والشعور بالموت الوشيك.</li>
                        <li><strong>الرهاب الاجتماعي (Social Anxiety Disorder):</strong> خوف شديد ومرضي من المراقبة أو الحكم من الآخرين في المواقف الاجتماعية، مما يؤدي لتجنبها تماماً.</li>
                    </ul>

                    <h3>2. اضطراب الاكتئاب الجسيم (Major Depressive Disorder)</h3>
                    <p>لا يُعد حزناً عابراً، بل هو مرض جهازي يؤثر على الجسم والدماغ معاً:</p>
                    <ul>
                        <li><strong>الأعراض النفسية:</strong> شعور عميق بالفراغ، فقدان المتعة في الهوايات والأنشطة (Anhedonia)، الشعور بالذنب وانعدام القيمة، وأفكار متكررة حول الموت أو الانتحار.</li>
                        <li><strong>الأعراض الجسدية:</strong> اضطرابات حادة في النوم (أرق أو نوم مفرط)، تغيرات ملحوظة في الوزن والشهية، وإرهاق بدني مزمن بلا سبب عضوي واضح.</li>
                    </ul>

                    ${adCodeInArticle}

                    <h3>3. اضطراب ثنائي القطب (Bipolar Disorder)</h3>
                    <p>يتميز بتقلبات دراماتيكية في مستويات الطاقة والمزاج:</p>
                    <ul>
                        <li><strong>نوبة الهوس (Mania):</strong> طاقة مفرطة، ثقة مبالغ فيها بالنفس، حديث سريع ومتطاير، وقلة الحاجة للنوم واتخاذ قرارات متهورة.</li>
                        <li><strong>نوبة الاكتئاب:</strong> هبوط حاد في الطاقة، حزن عميق، وعجز عن إنجاز أبسط المهام.</li>
                    </ul>

                    <h3>4. الفصام واضطرابات الطيف الذهاني (Schizophrenia)</h3>
                    <p>مرض عقلي مزمن يغير تفسير الواقع:</p>
                    <ul>
                        <li><strong>الأعراض الإيجابية:</strong> الهلاوس (سماع أصوات أو رؤية أشياء غير موجودة)، والضلالات (معتقدات خاطئة راسخة لا تقبل النقاش مثل الاضطهاد أو العظمة).</li>
                        <li><strong>الأعراض السلبية:</strong> التبلد العاطفي، انعدام الدافعية، والانسحاب الاجتماعي.</li>
                    </ul>

                    <h3>5. اضطراب الوسواس القهري (OCD)</h3>
                    <ul>
                        <li><strong>الوسواس:</strong> أفكار أو صور أو رغبات متكررة ومقتحمة تسبب قلقاً شديداً (مثل الخوف من التلوث أو الجراثيم).</li>
                        <li><strong>الأقوال والأفعال القهرية:</strong> سلوكيات متكررة يشعر المريض مجبراً على أيتها لتقليل القلق (مثل غسل اليدين مئات المرات، أو التأكد المتكرر من إغلاق الأبواب).</li>
                    </ul>

                    <h3>6. اضطراب الكرب التالي للصدمة (PTSD)</h3>
                    <p>يحدث نتيجة التعرض لتجربة صادمة قاسية (حروب، حوادث عنيفة، اعتداءات):</p>
                    <ul>
                        <li><strong>الأعراض:</strong> استرجاع الصدمة عبر ذكريات قسرية أو كابوسية (Flashbacks)، التجنب التام لأي منبهات تذكر بالحدث، وسرعة الاستفزاز وفرط اليقظة.</li>
                    </ul>

                    <h2>ثانياً: الأسباب والعوامل المؤدية للأمراض النفسية</h2>
                    <p>لا تنتج الأمراض النفسية عن سبب واحد، بل هي تفاعل معقد بين عدة عوامل:</p>
                    <ul>
                        <li><strong>العوامل البيولوجية والوراثية:</strong> وجود تاريخ فصيلي أو عائلي للإصابة يزيد من احتمالية الجينات المرتبطة باختلال النواقل العصبية (مثل السيروتونين والدوبامين والنورإبينفرين).</li>
                        <li><strong>كيمياء الدماغ:</strong> اختلال في التوازن الكيميائي والإشارات العصبية المسؤولة عن تنظيم المزاج والتفكير.</li>
                        <li><strong>الضغوط البيئية والنفسية:</strong> التعرض لصدمات الطفولة، سوء المعاملة، الضغوط المادية المزمنة، فقدان شخص عزيز، أو بيئة العمل السامة.</li>
                        <li><strong>الأمراض الجسدية المزمنة:</strong> الإصابة بأمراض طويلة الأمد قد تسبب ضغطاً نفسياً يؤدي للاكتئاب أو القلق الثانوي.</li>
                    </ul>

                    <h2>ثالثاً: البروتوكولات العلاجية الحديثة ومتعددة التخصصات</h2>
                    <p>يعتمد النجاح العلاجي على خطة شخصية مصممة خصيصاً لكل مريض، وغالباً ما تتضمن المحاور التالية:</p>
                    
                    <h3>1. العلاج النفسي (Psychotherapy / Talk Therapy)</h3>
                    <ul>
                        <li><strong>العلاج المعرفي السلوكي (CBT):</strong> يركز على تحديد أنماط التفكير السلبية والخاطئة وإعادة صياغتها، وتعديل السلوكيات المرتبطة بها.</li>
                        <li><strong>العلاج السلوكي الجدلي (DBT):</strong> يركز على بناء مهارات تحمل الضيق، تنظيم المشاعر، وتحسين العلاقات الشخصية.</li>
                        <li><strong>العلاج بالتعرض (Exposure Therapy):</strong> يُستخدم بفعالية في علاج الرهاب والوسواس القهري واضطراب ما بعد الصدمة عبر مواجهة المخاوف تدريجياً في بيئة آمنة.</li>
                    </ul>

                    <h3>2. العلاجات الدوائية (Pharmacotherapy)</h3>
                    <p>تُوصف تحت إشراف طبي دقيق لإعادة التوازن الكيميائي للدماغ:</p>
                    <ul>
                        <li><strong>مضادات الاكتئاب (SSRIs & SNRIs):</strong> لتنظيم السيروتونين والنورإبينفرين (تُستخدم للاكتئاب والقلق والوسواس).</li>
                        <li><strong>مثبتات المزاج وأدوية مضادة للذهان:</strong> للتحكم في التقلبات الحادة للفصام وثنائي القطب.</li>
                        <li><strong>مضادات القلق:</strong> لفترات قصيرة وتحت السيطرة الطبية لمنع الإدمان.</li>
                    </ul>

                    <h3>3. التدخلات الحيوية المتقدمة (لحالات المقاومة العلاجية)</h3>
                    <ul>
                        <li><strong>التحفيز المغناطيسي عبر الجمجمة (TMS):</strong> تقنية غير جراحية تستخدم مجالات مغناطيسية لتحفيز الخلايا العصبية في الدماغ للمصابين بالاكتئاب المقاوم للأدوية.</li>
                        <li><strong>العلاج بالكهرباء (ECT):</strong> يُستخدم تحت التخدير الكلي للحالات الشديدة جداً مثل الاكتئاب الذهاني الخطير أو الهوس الحاد الذي لا يستجيب للأدوية.</li>
                    </ul>

                    <h3>4. التعديلات الجذرية في نمط الحياة (Lifestyle Medicine)</h3>
                    <ul>
                        <li><strong>النشاط البدني الهوائي:</strong> أثبتت الدراسات أن الرياضة المنتظمة ترفع مستويات الإندورفين والدوبامين وتعمل كـ "مضاد اكتئاب طبيعي".</li>
                        <li><strong>تنظيم الساعة البيولوجية والنوم:</strong> النوم العميق لمدد كافية يعيد تنظيم العمليات العصبية.</li>
                        <li><strong>التغذية والترطيب:</strong> التركيز على الأغذية الغنية بأحماض أوميغا 3 والفيتامينات المرتبطة بصحة الدماغ.</li>
                    </ul>

                    <h2>رابعاً: استراتيجيات الوقاية والدعم النفسي المجتمعي</h2>
                    <p>الوقاية خير من العلاج، وسلامة الصحة النفسية تتطلب بناء مناعة نفسية واجتماعية قوية:</p>
                    <ul>
                        <li><strong>الكشف والتدخل المبكر:</strong> إن ملاحظة التغيرات المفاجئة في السلوك، أو النوم، أو المزاج، وسرعة استشارة المختص النفسي في بداية ظهور الأعراض، تمنع تفاقم الحالة وتختصر رحلة العلاج بشكل كبير.</li>
                        <li><strong>بناء شبكة دعم اجتماعي قوية:</strong> التواصل الفعال مع العائلة والأصدقاء الموثوقين، والتعبير عن المشاعر بصراحة، يقلل من حدة الشعور بالوحدة والعزلة التي تغذي الاضطرابات النفسية.</li>
                        <li><strong>إدارة ضغوط الحياة (Stress Management):</strong> تعلم مهارات إدارة الوقت، ووضع حدود صحية في العمل والعلاقات، وممارسة اليقظة الذهنية (Mindfulness) للتعامل مع الضغوط اليومية قبل تحولها إلى صدمات مزمنة.</li>
                        <li><strong>التوعية وكسر وصمة العار (Stigma):</strong> نشر الوعي المجتمعي بأن المرض النفسي هو حالة طبية تصيب الدماغ كأي عضو آخر في الجسم، يساهم في تشجيع المرضى على طلب المساعدة دون خوف من الأحكام السلبية أو العزلة الاجتماعية.</li>
                    </ul>

                    <h2>رابعاً: طرق علاج ارتفاع ضغط الدم</h2>
                    <p>يعتمد علاج ارتفاع ضغط الدم على شقين رئيسيين متكاملين: التعديل الجذري لنمط الحياة، والعلاج الدوائي الموصوف طبياً.</p>

                        <li><strong>مدرات البول (Diuretics):</strong> تساعد الكلى على التخلص من الصوديوم الزائد والماء عبر البول، مما يقلل حجم السوائل في الأوعية الدموية.</li>
                        <li><strong>حاصرات بيتا (Beta-blockers):</strong> تقلل من سرعة ضربات القلب وقوته، مما يقلل كمية الدم المفقودة عبر الشرايين في كل نبضة.</li>
                        <li><strong>موسعات الأوعية ومثبطات الإنزيم المحول للأجيوتنسين (ACE inhibitors):</strong> تعمل على إرخاء الأوعية الدموية ومنع تضيقها ليمر الدم بسهولة.</li>
                        <li><strong>حاصرات قنوات الكالسيوم:</strong> تمنع دخول الكالسيوم إلى خلايا عضلات القلب والأوعية الدموية، مما يساعد على استرخائها وتوسيعها.</li>
                    </ul>

                    <h3>2. العلاج الطبيعي وتعديلات نمط الحياة:</h3>

                        <li><strong>فقدان الوزن الزائد:</strong> كل كيلوجرام تفقده من وزنك الزائد ينعكس إيجاباً وبشكل ملحوظ على خفض مستويات ضغط الدم.</li>
                    </ul>

                const originalIndex = articlesData.findIndex(a => a.title === art.title);
                const card = document.createElement('div');
                card.className = 'article-card';
                card.innerHTML = `
                    <div>
                        <img src="${art.image}" alt="${art.title}" class="card-img">
                        <div class="card-content">
                            <h3>${art.title}</h3>
                            <p>${art.desc}</p>
                        </div>
                    </div>
                    <div style="padding: 0 20px 20px 20px;">
                        <button class="read-more" onclick="openModal(${originalIndex})">قراءة المقال كاملًا ومشاهدة الشرح</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // تعبئة شريط آخر المقالات التلقائي
        const ticker = document.getElementById('tickerContent');
        let tickerHTML = '';
        for (let i = 0; i < 3; i++) {
            articlesData.forEach((art, originalIndex) => {
                tickerHTML += `<span onclick="openModal(${originalIndex})">• ${art.title}</span>`;
            });
        }
        ticker.innerHTML = tickerHTML;

        // عرض جميع المقالات افتراضياً
        function renderAllArticles() {
            const grid = document.getElementById('articlesGrid');
            grid.innerHTML = '';
            articlesData.forEach((art, index) => {
                const card = document.createElement('div');
                card.className = 'article-card';
                card.innerHTML = `
                    <div>
                        <img src="${art.image}" alt="${art.title}" class="card-img">
                        <div class="card-content">
                            <h3>${art.title}</h3>
                            <p>${art.desc}</p>
                        </div>
                    </div>
                    <div style="padding: 0 20px 20px 20px;">
                        <button class="read-more" onclick="openModal(${index})">قراءة المقال كاملًا ومشاهدة الشرح</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
        renderAllArticles();

        const modal = document.getElementById('articleModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const videoContainerBox = document.getElementById('videoContainerBox');

        function openModal(index) {
            currentArticleIndex = index;
            modalTitle.innerText = articlesData[index].title;
            videoContainerBox.innerHTML = articlesData[index].videoHTML;
            modalBody.innerHTML = articlesData[index].content;
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';

            document.getElementById('prevBtn').style.display = index > 0 ? 'block' : 'none';
            document.getElementById('nextBtn').style.display = index < articlesData.length - 1 ? 'block' : 'none';

            modal.scrollTop = 0;

            try {
                (adsbygoogle = window.adsbygoogle || []).push({});
            } catch (e) {
                console.log("Adsbygoogle error: ", e);
            }
        }

        let currentArticleIndex = 0;
        function navigateArticle(direction) {
            const newIndex = currentArticleIndex + direction;
            if (newIndex >= 0 && newIndex < articlesData.length) {
                openModal(newIndex);
            }
        }

        function openPrivacyPolicy() {
            videoContainerBox.innerHTML = `<div style="font-size: 2.5rem; padding: 20px;">🔒 سياسة الخصوصية وحماية حقوق النشر</div>`;
            modalTitle.innerText = "سياسة الخصوصية - موقع صحيح (heib12.com)";
            modalBody.innerHTML = `
                <p>مرحباً بكم في موقع <strong>صحيح (heib12.com)</strong>. نحن نولي اهتماماً بالغاً بخصوصية زوارنا، وتوضح وثيقة سياسة الخصوصية هذه أنواع المعلومات الشخصية التي يتم جمعها وكيفية استخدامها وحمايتها.</p>
                <h2>1. إخلاء المسؤولية الطبية</h2>
                <p>المحتوى المنشور في الموقع هو لأغراض التثقيف والتوعية العلمية فقط، ولا يُغني عن الاستشارة الطبية التخصصية.</p>
            `;
            document.getElementById('prevBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }

        // --- خاصية الحماية الذكية وبصمة النسخ ---
        document.addEventListener('copy', function(e) {
            const selection = window.getSelection();
            if (selection.rangeCount === 0) return;
            const selectedText = selection.toString();
            if (selectedText.length < 10) return;

            e.preventDefault();
            const secretSignature = "\n\n--- [المصدر الأصلي: موقع صحيح] ---\n🔗 رابط المقال المعتمد: https://heib12.com\n🔒 حقوق النشر محفوظة © لصالح الهيب كليل - موقع صحيح (heib12.com) | معرف البصمة: [HEIB12-SECURE-AUTH-2026]";
            const modifiedText = selectedText + secretSignature;

            if (e.clipboardData) {
                e.clipboardData.setData('text/plain', modifiedText);
            }
        });
    </script>
